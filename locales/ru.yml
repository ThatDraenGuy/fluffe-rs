_version: 1
commands:
  /get_furry: "Скинуть фурри-картинку"
  /pet: "[/pet <@someone>] Погладить кого-то"
  /my_stats: "Посмотреть свои статы"
  /top_pets: "Посмотреть топ поглаженных/погладивших"
  /shipu: "Скинуть ОЛЕГА (🔥) ШИПУЛИНА"
  /about: "Информация о боте"
msg:
  common:
    error:
      server:
        db_err: "Ошибка при работе с базой данных 😡😡😡. Лови сообщение об ошибке и скажи ДраэнГаю, что он лузер: %{msg}"
        unknown_player: "Сорян, этот пользователь не играет со мной в этом чате 😿 (если они что-нибудь сюда напишут, то я с радостью приму их в нашу компашку 😺)"
        unknown_err: "Что-то пошло не так, сорян 😿. Лови сообщение об ошибке: %{msg}"
      client:
        mention_argument: "Для использования этой команды надо было тэгнуть кого-нибудь, например: \"/%{command} %{mention}\""
        unknown_username: "Я не знаю кто такой @%{mention}, они со мной не общаются(((("
  pet:
    success: "Поглаживание успешно! %{target} был поглажен уже %{num} раз(а)! 😺"
    error:
      no_photo: "Я не смог найти аватарку %{mention}((("
      me: "Низя меня гладить 😾"
      self: "Низя гладить себя, %{mention}!"
  my_stats:
    success: |
      Статы %{target}:
      - поглаживаний дано: %{pets_given}
      - поглаживаний получено: %{pets_received}
      - пушистых монеток: %{coins}
  top_pets:
    success: |
      Топ поглаживаемых:
      %{received_list}

      Топ поглаживающих:
      %{given_list}
  about:
    info: |
      Флаффе-рс бот: странный бот для странного чата
      Версия: %{version}
      Авторы: %{authors}
      Последнее обновление: %{last_update}
      Исходный код: %{source}
  femboy:
    start: "Пришло время выбрать фембойчика!!!"
    win: "Фембойчик дня - %{mention}, в %{num} раз!"
    
    leaderboard:
      success: "Список фембой лидеров:"
      line: "%{place}. %{name}: %{wins_num}"
    
    balance:
      success: ", на твоём счету %{balance} cum(s)"

  user:
    common:
      error:
        already_exists: "Пользователь уже существует"

  shipu:
    is_shipu: "ТЫ ОЛЕГ ШИПУЛИН 🔥🔥🔥🔥🔥"
    not_shipu: "ты не олег шипулин 😿"
